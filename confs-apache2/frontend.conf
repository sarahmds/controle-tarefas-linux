<VirtualHost *:80>
    ServerName vidabichos.com.br
    DocumentRoot /var/www/frontend

    <Directory /var/www/frontend>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/vidabichos-error.log
    CustomLog ${APACHE_LOG_DIR}/vidabichos-access.log combined
</VirtualHost>
