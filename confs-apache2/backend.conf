<VirtualHost *:80>
    ServerName vidabichos.backend.biz
    DocumentRoot /var/www/backend

    <Directory /var/www/backend>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/vidabichos-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/vidabichos-backend-access.log combined
</VirtualHost>
