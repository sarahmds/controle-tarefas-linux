
<VirtualHost *:80>
    ServerName controletarefas.backend.biz
    DocumentRoot /var/www/site-backend
    <Directory /var/www/site-backend>
        AllowOverride All
        AuthType Basic
        AuthName "Área Administrativa"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>
</VirtualHost>
